name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        run: mvn clean test

      - name: Build Docker image (test)
        run: docker build -t habittracker-test .

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$DEPLOY_HOOK"

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..20}; do
          if curl -f --max-time 60 https://habittracker-app-ivdt.onrender.com/actuator/health; then         
          echo "Health check passed"
              exit 0
            fi
            echo "Waiting for app to be ready... (attempt $i)"
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          exit 1